name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    # A manually dispatched preview branch is still not a production release.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install locked validation tools
        run: |
          npm ci
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Verify source, regressions and exact publish artifact
        run: npm run verify
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Record successfully deployed release
        if: success() && steps.deployment.outcome == 'success'
        env:
          CHANGELOG_WRITE_TOKEN: ${{ secrets.CHANGELOG_WRITE_TOKEN }}
          DEPLOYED_SHA: ${{ github.sha }}
        run: node update-d1-changelog.cjs
